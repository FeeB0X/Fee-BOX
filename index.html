<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>FEE BOX | The Ultimate Gift Magic</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700&display=swap');
        
        body { 
            font-family: 'Tajawal', sans-serif; 
            background-image: url('https://i.ibb.co/ks56y1yd/1782867067301.png');
            background-size: cover; 
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            display: flex; 
            justify-content: center; 
            align-items: center; 
            min-height: 100vh; 
            margin: 0; 
        }
        
        .box { 
            background: rgba(255, 255, 255, 0.88); 
            backdrop-filter: blur(10px);
            padding: 35px; 
            border-radius: 25px; 
            box-shadow: 0 20px 60px rgba(0,0,0,0.3); 
            width: 90%; 
            max-width: 460px; 
            text-align: center; 
            border: none;
        }
        
        h1 { color: #2e4031; font-size: 32px; margin-bottom: 5px; font-weight: 700; }
        .subtitle { color: #666; margin-bottom: 25px; font-size: 14px; text-transform: uppercase; font-weight: bold; }
        label { display: block; text-align: right; font-weight: 700; margin-top: 20px; color: #222; font-size: 15px; }
        input, textarea, select { width: 100%; padding: 14px; margin-top: 8px; border: 2px solid #cbd5e1; border-radius: 14px; box-sizing: border-box; font-family: 'Tajawal', sans-serif; background: #f8fafc; font-size: 14px; transition: all 0.3s; text-align: right; }
        input:focus, textarea:focus, select:focus { border-color: #6b8e23; outline: none; background: #fff; box-shadow: 0 0 10px rgba(107, 142, 35, 0.2); }
        button { width: 100%; background: #6b8e23; color: white; padding: 16px; border: none; border-radius: 14px; margin-top: 25px; font-size: 18px; cursor: pointer; transition: 0.3s; font-family: 'Tajawal', sans-serif; font-weight: bold; box-shadow: 0 4px 12px rgba(107, 142, 35, 0.3); }
        button:hover { background: #4a6318; transform: translateY(-2px); box-shadow: 0 66px 15px rgba(107, 142, 35, 0.4); }
        #result-area { display: none; }
        .result-emoji { font-size: 55px; margin-bottom: 10px; }
    </style>
</head>
<body>

<div class="box">
    <h1>FEE BOX</h1>
    <div class="subtitle">Mind-Reading Gift Assistant ✨</div>
    
    <div id="quiz-area">
        <label>قولي لنا كده، الهدية القمر دي رايحة لمين؟ 🤔</label>
        <select id="target">
            <option value="men">ولد / راجل (الوحوش 💪)</option>
            <option value="women">بنت / ست (الرقة والدلع كله 🌸)</option>
            <option value="kids">كتكوت صغير بيحب الفرفشة 🎨</option>
        </select>

        <label>إيه أكتر ستايل هدايا تحس إنه هيفرحه؟ 🎁</label>
        <select id="gift-style">
            <option value="sport">حاجات جيم، تمرين، وفورمة وعاش يا بطل 🏆</option>
            <option value="coffee">روقان، بن، مجات شيك، وتظبيط دماغ ☕</option>
            <option value="skincare">دلع، سكين كير، وميكب وترويق 🌸</option>
            <option value="kids-fun">ألعاب تلوين، بازل، وفرفشة وبناء ذكاء 🎨</option>
            <option value="classic">ساعات، برفيوم، وحاجات كلاسيك فخمة ✨</option>
            <option value="not-sure">لسه مش متأكد.. سيب الـ AI يقرر ويقترح! 🤖</option>
        </select>

        <label>افتحي لنا قلبك بقى وفضفضي هنا.. (إيه أكتر حاجات بيحب يعملها؟ بيقضي يومه إيه؟ إيه اللي بيبسطه؟) ✍️</label>
        <textarea id="about" rows="4" placeholder="اكتبي براحتك.. بيحب القهوة، مدمن بلايستيشن، وراه طحن مذاكرة، بيحب القراءة.. والـ AI بتاعنا هيحلل شخصيته ويلقط الهدية صح!"></textarea>
        
        <button onclick="analyzeGift()">اكتشف الهدية المثالية 🎁</button>
    </div>

    <div id="result-area">
        <div class="result-emoji" id="res-emoji"></div>
        <h2 id="res-title" style="color: #6b8e23; font-size: 26px; margin-top: 0;"></h2>
        <p id="res-desc" style="font-size: 16px; line-height: 1.7; color: #222; margin-bottom: 25px; text-align: right; direction: rtl;"></p>
        <button onclick="location.reload()" style="background: #4a5d4e;">جرّب مع شخص تاني 🔄</button>
    </div>
</div>

<script>
    function analyzeGift() {
        const text = document.getElementById('about').value;
        const giftStyle = document.getElementById('gift-style').value;
        
        document.getElementById('quiz-area').style.display = 'none';
        document.getElementById('result-area').style.display = 'block';

        const emoji = document.getElementById('res-emoji');
        const title = document.getElementById('res-title');
        const desc = document.getElementById('res-desc');

        if (giftStyle === 'sport' || text.includes('جيم') || text.includes('رياضة') || text.includes('تمرين') || text.includes('gym')) {
            emoji.innerText = "🏆";
            title.innerText = "For The Grind Box";
            desc.innerText = "تحليل شخصية الـ AI: الشخص ده طموح، نشيط، وعاشق للتحدي والفورمة! بوكس الـ Grind الملكي بتاعنا هو الأنسب ليه، مليان طاقة وحاجات تشجعه يفرتك التمرين ويحقق أهدافه.";
        } 
        else if (giftStyle === 'coffee' || text.includes('قهوة') || text.includes('شغل') || text.includes('مذاكرة') || text.includes('coffee') || text.includes('قراءة')) {
            emoji.innerText = "☕";
            title.innerText = "The Focus & Chill Box";
            desc.innerText = "تحليل شخصية الـ AI: ده شخص دحيح وطموح، وراه طحن تفكير أو مذاكرة وبيدور على الروقان وسط الزحمة! البوكس ده معمول مخصوص عشان يظبط الدماغ ويفصله بجرعة كافيين وراحة تامة.";
        } 
        else if (giftStyle === 'skincare' || text.includes('دلع') || text.includes('سكين') || text.includes('ميكاب') || text.includes('skin') || text.includes('اهتمام')) {
            emoji.innerText = "🌸";
            title.innerText = "I'm Just A Girl Box";
            desc.innerText = "تحليل شخصية الـ AI: الرقة والدلع كله! الشخصية دي بتحب الاهتمام والتفاصيل الرايقة. البوكس البينك ده فيه كل أسرار الترويق والسكين كير اللي تخلي المود بتاعها دايماً في السحاب.";
        } 
        else if (giftStyle === 'kids-fun' || text.includes('تلوين') || text.includes('لعب') || text.includes('رسم') || text.includes('اطفال') || text.includes('طفل')) {
            emoji.innerText = "🎨";
            title.innerText = "The Creative Kid Box";
            desc.innerText = "تحليل شخصية الـ AI: كتكوت عبقري ومليان طاقة وفضول! البوكس ده مليان ألعاب تلوين، بازل، وحاجات فنية بتشغل ذكاءه وتخليه يطلع إبداعه ويفرفش بعيد عن الشاشات.";
        } 
        else if (giftStyle === 'classic' || text.includes('ساعة') || text.includes('برفيوم') || text.includes('شيك') || text.includes('فخم')) {
            emoji.innerText = "✨";
            title.innerText = "The Elegance Classic Box";
            desc.innerText = "تحليل شخصية الـ AI: شخصية كلاسيكية، بتحب الفخامة والشياكة والهيبة. البوكس ده بيجمع بين الأناقة والجمال، هدايا راقية تليق بمقامه وتخليه متميز وسط الكل.";
        } 
        else {
            emoji.innerText = "🔮";
            title.innerText = "The Custom FEE BOX Magic";
            desc.innerText = "تحليل شخصية الـ AI: لقطنا الفولة! بناءً على الفضفضة والكلام الجامد اللي حكيتيه عنه، إحنا هنفصل له بوكس مخصص 'تفصيل' على مقاس شخصيته الفريدة وهواياته. هدايا كرييتف ومستحيل يتوقعها!";
        }
    }
</script>

</body>
</html>
